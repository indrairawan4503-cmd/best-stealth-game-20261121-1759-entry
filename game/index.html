<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museum at Night — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0a10; }
  #game {
    position: fixed; inset: 0; margin: auto;
    width: min(100vw, 150vh); height: min(100vh, 66.666vw);
    display: block; touch-action: none; background: #2e2a33;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Museum at Night: sneak past the guards, steal the Golden Ibis, and slip out the exit unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
